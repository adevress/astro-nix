[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpi-hello"
version = "1.0.0"
description = "Minimal MPI hello world using mpi4py"
requires-python = ">=3.9"
dependencies = ["mpi4py"]

[project.scripts]
mpi-hello = "mpi_hello:main"

[tool.setuptools.packages.find]
where = ["src"]
